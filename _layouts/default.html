<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Source+Sans+3:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% if page.extra_css %}<link rel="stylesheet" href="{{ page.extra_css | relative_url }}">{% endif %}
  <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
  {% seo title=false %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "{{ site.author }}",
    "url": "{{ site.url }}",
    "affiliation": [
      {
        "@type": "Organization",
        "name": "Austrian Institute of Technology"
      },
      {
        "@type": "Organization",
        "name": "UiT The Arctic University of Norway"
      }
    ],
    "sameAs": [
      "https://www.linkedin.com/in/michael-j-bernstein",
      "https://orcid.org/0000-0001-7980-0489",
      "https://scholar.google.com/citations?hl=en&user=e6c3Mn0AAAAJ&view_op=list_works"
    ]
  }
  </script>
</head>
<body>

{% include nav.html %}

<main>
{{ content }}
</main>

{% include footer.html %}

<script src="{{ '/assets/js/nav.js' | relative_url }}"></script>

</body>
</html>
